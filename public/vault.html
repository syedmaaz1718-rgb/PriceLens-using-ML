<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My vault - PriceLens</title><link rel="stylesheet" href="/app.css"></head><body>
<div id="app"><div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px"><div><div class="mono">Everything you own, priced</div><h1 class="serif" style="margin-top:8px">My vault.</h1></div><a class="btn" href="/appraise" id="add"></a></div><div id="v" style="margin-top:24px"></div></div>
<script src="/app.js"></script><script>
(async()=>{const user=await shell('side','/vault');document.getElementById('add').innerHTML=ic('plus',15)+' Add an item';const V=document.getElementById('v');
if(!user){V.innerHTML=`<div class="card" style="text-align:center;padding:50px"><div class="serif" style="font-size:34px">Sign in to open your vault</div><p class="muted" style="margin:10px 0 22px">Save items from any estimate and see their combined worth.</p><a class="btn" href="/login?next=/vault">Sign in or create account</a></div>`;return}
async function load(){const d=await api('/api/vault');
 if(!d.items.length){V.innerHTML=`<div class="card" style="padding:44px;text-align:center"><div class="serif" style="font-size:32px">Your vault is empty</div><p class="muted" style="margin:10px 0 22px">Appraise a car or bike, then press "Save to my vault".</p><a class="btn" href="/appraise">Appraise an item</a></div>`;return}
 V.innerHTML=`<div class="grid cols" style="grid-template-columns:1fr 1fr 1fr"><div class="card tile"><div class="lab">${ic('wallet',14)} Total worth (fair estimates)</div><div class="serif" style="font-size:52px">${inr(d.total)}</div></div><div class="card"><div class="lab">${ic('layers',14)} Items</div><div class="serif" style="font-size:52px">${d.items.length}</div></div><div class="card"><div class="lab">${ic('clock',14)} Next 12 months</div><div class="serif ${d.change12<0?'dn':'up'}" style="font-size:52px">${d.change12<0?'-':'+'}${inr(Math.abs(d.change12))}</div></div></div>
 <div class="grid" style="margin-top:16px">${d.items.map(it=>{const t=it.target,pr=t?Math.min(100,it.fair/t*100):0;return `<div class="card fade"><div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><div class="mono">${esc(it.category)} · ${it.input.year} · ${num(it.input.km)} km · owner ${it.input.owner}</div><div style="font-size:20px;margin:6px 0">${esc(it.label)}</div><div class="mono">Range ${inrK(it.low)} - ${inrK(it.high)} · estimated ${new Date(it.appraised_at).toLocaleDateString('en-IN')}</div></div><div style="text-align:right"><div class="serif" style="font-size:44px">${inr(it.fair)}</div>${it.waiting12!==undefined?`<div class="mono ${it.waiting12<0?'dn':'up'}">${it.waiting12<0?'-':'+'}${inrK(Math.abs(it.waiting12))} in 12 months</div>`:''}</div></div>
  <div style="margin-top:16px">${t?`<div class="lab">${ic('tag',13)} Sell target ${inr(t)}</div><div class="bar"><b style="width:${pr}%"></b></div><div class="mono" style="margin-top:6px">${it.fair>=t?'Target reached at the fair estimate':inr(t-it.fair)+' below your target'}</div>`:`<div class="mono">No sell target set</div>`}</div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="ghost" data-t="${it.id}">${ic('tag',14)} ${t?'Change':'Set'} target</button><button class="ghost" data-r="${it.id}">${ic('refresh',14)} Re-appraise</button><button class="ghost" data-d="${it.id}">${ic('x',14)} Remove</button></div></div>`}).join('')}</div>`;
 V.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const x=prompt('Target selling price in rupees (empty to clear)');if(x===null)return;await api('/api/vault/'+b.dataset.t,{target:x.replace(/[^\d]/g,'')||null},'PATCH');load()});
 V.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await api('/api/vault/'+b.dataset.r+'/reappraise',{});toast('Re-appraised');load()});
 V.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this item from your vault?')){await api('/api/vault/'+b.dataset.d,undefined,'DELETE');load()}})}
load()})();
</script></body></html>
