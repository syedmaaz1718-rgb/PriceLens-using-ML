<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - PriceLens</title><link rel="stylesheet" href="/app.css"></head><body>
<div id="app"><div style="max-width:440px;margin:30px auto"><div class="mono" id="k">Welcome back</div><h2 class="serif" style="margin:8px 0 24px" id="h">Sign in.</h2>
<form class="card" id="f"><label class="f" id="nw" style="display:none"><div class="lab">Name</div><input id="name" type="text" autocomplete="name"></label><label class="f" style="margin-top:14px"><div class="lab">Email</div><input id="email" type="email" required autocomplete="email"></label><label class="f" style="margin-top:14px"><div class="lab">Password</div><input id="pw" type="password" required minlength="8" autocomplete="current-password"></label>
<button class="btn" id="go" style="margin-top:20px;width:100%;justify-content:center">Sign in</button><div id="err" style="margin-top:12px"></div><div style="margin-top:16px;font-size:14px" class="muted"><span id="sw">New here?</span> <a href="#" id="tg" class="up" style="text-decoration:underline">Create an account</a></div></form></div></div>
<script src="/app.js"></script><script>
(async()=>{const u=await shell('top','');if(u){location.href='/'}let reg=false;const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next')||'/';
$('tg').onclick=e=>{e.preventDefault();reg=!reg;$('nw').style.display=reg?'block':'none';$('h').textContent=reg?'Create account.':'Sign in.';$('k').textContent=reg?'Get started':'Welcome back';$('go').textContent=reg?'Create account':'Sign in';$('sw').textContent=reg?'Have an account?':'New here?';$('tg').textContent=reg?'Sign in':'Create an account';$('pw').autocomplete=reg?'new-password':'current-password'};
$('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;try{await api(reg?'/api/auth/register':'/api/auth/login',{name:$('name').value,email:$('email').value,password:$('pw').value});location.href=next.startsWith('/')?next:'/'}catch(x){$('err').innerHTML=`<div class="note warn">${esc(x.message)}</div>`;$('go').disabled=false}}})();
</script></body></html>
